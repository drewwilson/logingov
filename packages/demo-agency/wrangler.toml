name = "logingov-demo-agency"
main = "src/index.ts"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]

# Service binding for Worker-to-Worker calls (token exchange, userinfo)
[[services]]
binding = "AUTH_CORE"
service = "logingov"

[vars]
AUTH_CORE_URL = "https://logingov.drew-206.workers.dev"
CLIENT_ID = "urn:gov:gsa:openidconnect.profiles:sp:sso:irs:app"
AGENCY_ID = "beb2fd51-a3ca-4d38-b7bb-3f53459aa07f"  # ← paste your agency UUID here after creating it in the agency admin UI
# aud for client_assertion JWT — must match auth-core's hardcoded value
TOKEN_ENDPOINT_AUD = "https://secure.login.gov/api/openid_connect/token"

